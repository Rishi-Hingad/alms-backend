[project]
name = "lease_app"
version = "0.0.1"
description = "Property Lease Management System"
requires-python = ">=3.10"
readme = "README.md"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "lease_app",
    "lease_management_system",
    "lease_masters"
]

[tool.setuptools.package-dir]
lease_app = "lease_app"
lease_management_system = "lease_app/lease_management_system"
lease_masters = "lease_app/lease_masters"